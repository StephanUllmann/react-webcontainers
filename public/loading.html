<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Environment...</title>
    <style>
      :root {
        --bg-center: #1e1e28;
        --text-color: #8b8b9e;
        --accent-color: #646cff;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-center);

        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          'Open Sans',
          'Helvetica Neue',
          sans-serif;
        overflow: hidden;
        user-select: none;
      }

      .loader-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
        transform: translateY(10px);
      }
      .spinner {
        width: 42px;
        height: 42px;
        border: 3px solid rgba(255, 255, 255, 0.05);
        border-radius: 50%;
        border-top-color: var(--accent-color);
        animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }

      .loading-text {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.75px;
        color: var(--text-color);
        text-transform: uppercase;
        animation: pulseText 2s ease-in-out infinite alternate;
      }

      /* Animations */
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulseText {
        0% {
          opacity: 0.4;
        }
        100% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="loader-wrapper">
      <div class="spinner"></div>
      <div class="loading-text">Initializing WebContainer</div>
    </div>
  </body>
</html>
